location = /_tracker-db/ {
    client_max_body_size 64m;
    gzip on;
    gzip_comp_level 5;
    gzip_types application/json;
    gzip_proxied any;
    gzip_min_length 1024;
    proxy_pass http://127.0.0.1:18643;
    proxy_set_header Authorization $http_authorization;
}

location = /_tracker-db/parts {
    client_max_body_size 1k;
    keepalive_timeout 0;
    gzip off;
    proxy_pass http://127.0.0.1:18643;
    proxy_set_header Authorization $http_authorization;
}
